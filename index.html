<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#511076">
<title>Pipple Chess — paars tegen wit</title>
<style>
  :root{
    --purple:#511076;
    --purple-dark:#3A0855;
    --magenta:#A8319E;
    --lilac:#F4EFF8;
    --lilac2:#E7DDEF;
    --light-sq:#F5F0F9;
    --dark-sq:#C3A5D8;
    --ink:#2C2733;
    --bsize:min(74vh,88vw,560px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Lato","Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--lilac);
    display:flex;flex-direction:column;
  }
  header{
    background:var(--purple);color:#fff;
    padding:14px 26px;display:flex;align-items:baseline;gap:16px;flex:0 0 auto;
  }
  header .brand{font-size:22px;font-weight:900;letter-spacing:.06em}
  header .brand span{color:#D9B8EC}
  header .tag{font-size:13px;color:#D9C6E6}
  main{
    flex:1 1 auto;display:flex;gap:28px;justify-content:center;
    align-items:flex-start;padding:22px;flex-wrap:wrap;
  }
  .board-wrap{max-width:100%}

  /* ---------------- bord ---------------- */
  .board-wrap{display:flex;flex-direction:column;gap:10px}
  .board-frame{
    display:grid;grid-template-columns:22px auto;grid-template-rows:auto 22px;
    gap:4px;align-items:stretch;
  }
  #ranks{display:grid;grid-template-rows:repeat(8,1fr)}
  #ranks div,#files div{
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--purple);
  }
  #files{display:grid;grid-template-columns:repeat(8,1fr)}
  #board{
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    width:var(--bsize);height:var(--bsize);
    border:3px solid var(--purple);border-radius:4px;overflow:hidden;
    box-shadow:0 10px 30px rgba(81,16,118,.22);
  }
  .sq{
    position:relative;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;min-width:0;min-height:0;overflow:hidden;
  }
  .sq.light{background:var(--light-sq)}
  .sq.dark{background:var(--dark-sq)}
  .sq.last{box-shadow:inset 0 0 0 4px rgba(168,49,158,.55)}
  .sq.sel{box-shadow:inset 0 0 0 4px var(--magenta)}
  .sq.hintfrom{box-shadow:inset 0 0 0 5px #21A179}
  .sq.hintto{box-shadow:inset 0 0 0 5px #21A179;animation:pulse 1s ease-in-out 3}
  @keyframes pulse{50%{box-shadow:inset 0 0 0 9px #21A179}}
  .sq.check{background:#E4646E !important}
  .sq .piece{
    font-size:calc(var(--bsize)/9);line-height:1;
    transition:transform .08s ease;pointer-events:none;
  }
  .piece.w{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);
    -webkit-text-stroke:1.4px var(--purple-dark)}
  .piece.b{color:var(--purple);text-shadow:0 1px 2px rgba(0,0,0,.28);
    -webkit-text-stroke:1.2px #24043a}
  .sq:hover .piece{transform:translateY(-2px)}
  .hint{
    position:absolute;width:26%;aspect-ratio:1/1;border-radius:50%;
    background:rgba(81,16,118,.38);pointer-events:none;
  }
  .sq.dark .hint{background:rgba(58,8,85,.45)}
  .hint.cap{width:86%;background:none;border:5px solid rgba(81,16,118,.45)}
  .sq.dark .hint.cap{border-color:rgba(58,8,85,.5)}
  .captured{display:flex;justify-content:space-between;font-size:22px;min-height:28px;
    letter-spacing:1px}
  .captured span{-webkit-text-stroke:1px var(--purple-dark)}

  /* ---------------- paneel ---------------- */
  .panel{width:320px;max-width:100%;display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border-radius:6px;padding:16px 18px;
    box-shadow:0 2px 10px rgba(81,16,118,.10)}
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--magenta)}
  #status{background:var(--purple);color:#fff;border-radius:6px;padding:14px 18px}
  #status .who{font-size:18px;font-weight:700}
  #status .note{font-size:12.5px;color:#D9C6E6;min-height:17px;margin-top:3px}
  label.row{display:flex;align-items:center;justify-content:space-between;
    font-size:13px;margin-bottom:10px;gap:10px}
  select,button{font-family:inherit}
  select{
    border:1px solid var(--lilac2);background:var(--lilac);color:var(--purple);
    border-radius:4px;padding:6px 8px;font-size:13px;font-weight:600;
  }
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{
    flex:1 1 auto;border:none;border-radius:4px;padding:10px 12px;font-size:13px;
    font-weight:700;cursor:pointer;background:var(--purple);color:#fff;
    transition:background .15s;
  }
  button:hover{background:var(--magenta)}
  button.ghost{background:var(--lilac);color:var(--purple)}
  button.ghost:hover{background:var(--lilac2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.hint-btn{background:#21A179}
  button.hint-btn:hover{background:#178a66}
  .strength{
    margin-top:12px;padding:10px 12px;background:var(--lilac);border-radius:4px;
    font-size:12px;line-height:1.5;color:var(--purple);
  }
  .strength b{display:block;font-size:12.5px;margin-bottom:2px}
  .strength .bar{height:6px;border-radius:3px;background:var(--lilac2);margin-top:7px}
  .strength .bar i{display:block;height:6px;border-radius:3px;background:var(--magenta)}
  .evalbar{
    height:16px;border-radius:8px;background:var(--purple);overflow:hidden;
    border:1px solid var(--lilac2);
  }
  .evalbar i{display:block;height:100%;background:#fff;
    border-right:2px solid var(--magenta);transition:width .35s ease}
  .evalrow{display:flex;justify-content:space-between;align-items:center;
    margin-top:8px;font-size:12px;color:#8E82A0}
  .evalrow b{font-size:16px;color:var(--purple)}
  .evalnote{margin-top:6px;font-size:12.5px;color:var(--purple);font-weight:600}
  #moves{height:230px;overflow-y:auto;font-size:13px}
  #moves table{width:100%;border-collapse:collapse}
  #moves td{padding:3px 6px}
  #moves td.n{color:#9A8FA6;width:32px;font-size:11.5px}
  #moves tr:nth-child(odd){background:var(--lilac)}
  #moves td.mv{font-weight:600;color:var(--purple)}
  #moves .empty{color:#9A8FA6;font-style:italic;padding:6px}

  /* ---------------- promotie ---------------- */
  #overlay{
    position:fixed;inset:0;background:rgba(58,8,85,.55);display:none;
    align-items:center;justify-content:center;z-index:10;
  }
  #overlay.on{display:flex}
  #promo{background:#fff;border-radius:8px;padding:22px 26px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35)}
  #promo h3{margin:0 0 14px;color:var(--purple);font-size:16px}
  #promo .opts{display:flex;gap:10px}
  #promo .opt{
    width:64px;height:64px;border-radius:6px;background:var(--lilac);
    display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer;
  }
  #promo .opt:hover{background:var(--lilac2)}
  footer{padding:8px 26px 14px;font-size:11.5px;color:#8E82A0;text-align:center}

  /* ---------------- telefoon / tablet ---------------- */
  @media (max-width:900px){
    :root{--bsize:min(calc(100vw - 56px),520px)}
    main{padding:12px;gap:16px}
    .panel{width:min(calc(100vw - 24px),520px)}
    header{padding:10px 16px}
    header .brand{font-size:18px}
    header .tag{font-size:11px}
    .sq .piece{font-size:calc(var(--bsize)/10)}
    #moves{height:150px}
    button{padding:12px 10px;font-size:13.5px}
    footer{padding:6px 16px 12px}
  }
  @media (max-width:420px){
    .btns{gap:6px}
    .card{padding:12px 14px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">pipple<span> chess</span></div>
  <div class="tag">paars tegen wit</div>
</header>

<main>
  <div class="board-wrap">
    <div class="board-frame">
      <div id="ranks"></div>
      <div id="board"></div>
      <div></div>
      <div id="files"></div>
    </div>
    <div class="captured"><div id="capW"></div><div id="capB"></div></div>
  </div>

  <div class="panel">
    <div id="status">
      <div class="who" id="statusWho">Wit is aan zet</div>
      <div class="note" id="statusNote"></div>
    </div>

    <div class="card">
      <h2>Stand</h2>
      <div class="evalbar"><i id="evalFill"></i></div>
      <div class="evalrow">
        <span>Wit</span><b id="evalScore">0.0</b><span>Paars</span>
      </div>
      <div class="evalnote" id="evalNote"></div>
    </div>

    <div class="card">
      <h2>Instellingen</h2>
      <label class="row">Tegenstander
        <select id="mode">
          <option value="human">Twee spelers</option>
          <option value="ai">Computer</option>
        </select>
      </label>
      <label class="row" id="rowSide">Jij speelt
        <select id="side">
          <option value="w">Wit</option>
          <option value="b">Paars</option>
        </select>
      </label>
      <label class="row" id="rowLevel">Niveau
        <select id="level">
          <option value="1">Beginner</option>
          <option value="2" selected>Gemiddeld</option>
          <option value="3">Pittig</option>
        </select>
      </label>
      <div class="btns">
        <button id="btnNew">Nieuw spel</button>
        <button id="btnHint" class="hint-btn">Hint</button>
        <button id="btnUndo" class="ghost">Zet terug</button>
        <button id="btnFlip" class="ghost">Draai bord</button>
      </div>
      <div class="strength" id="strength"></div>
    </div>

    <div class="card">
      <h2>Zetten</h2>
      <div id="moves"><div class="empty">Nog geen zetten gespeeld.</div></div>
    </div>
  </div>
</main>

<footer>Klik een stuk aan om de legale zetten te zien &middot; rokade, en-passant en promotie worden ondersteund</footer>

<div id="overlay"><div id="promo">
  <h3>Kies een stuk voor promotie</h3>
  <div class="opts" id="promoOpts"></div>
</div></div>

<script>
/* =======================================================================
   Schaakengine
   Bord: array van 64 velden, index 0 = a8 ... 63 = h1.
   Stuk: 'wp' (witte pion), 'bq' (paarse dame), enz. Leeg veld = null.
   ======================================================================= */
(function (global) {
  'use strict';

  const FILES = 'abcdefgh';
  const WHITE = 'w', BLACK = 'b';

  const fileOf = i => i % 8;
  const rankOf = i => (i / 8) | 0;            // 0 = rang 8, 7 = rang 1
  const sqIdx = (f, r) => r * 8 + f;
  const onBoard = (f, r) => f >= 0 && f < 8 && r >= 0 && r < 8;
  const name = i => FILES[fileOf(i)] + (8 - rankOf(i));
  const other = c => (c === WHITE ? BLACK : WHITE);

  const KNIGHT = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];
  const DIAG = [[1, 1], [1, -1], [-1, -1], [-1, 1]];
  const ORTHO = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const ALL8 = DIAG.concat(ORTHO);

  function initialState() {
    const b = new Array(64).fill(null);
    const back = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
    for (let f = 0; f < 8; f++) {
      b[sqIdx(f, 0)] = 'b' + back[f];
      b[sqIdx(f, 1)] = 'bp';
      b[sqIdx(f, 6)] = 'wp';
      b[sqIdx(f, 7)] = 'w' + back[f];
    }
    return {
      board: b, turn: WHITE,
      castling: { wK: true, wQ: true, bK: true, bQ: true },
      ep: null, half: 0, full: 1
    };
  }

  function cloneState(s) {
    return {
      board: s.board.slice(), turn: s.turn,
      castling: { wK: s.castling.wK, wQ: s.castling.wQ, bK: s.castling.bK, bQ: s.castling.bQ },
      ep: s.ep, half: s.half, full: s.full
    };
  }

  function kingSquare(board, color) {
    const k = color + 'k';
    for (let i = 0; i < 64; i++) if (board[i] === k) return i;
    return -1;
  }

  /* Wordt veld `sq` aangevallen door kleur `by`? */
  function isAttacked(board, sq, by) {
    const f = fileOf(sq), r = rankOf(sq);
    const pr = by === WHITE ? r + 1 : r - 1;   // vanaf welke rij slaat die pion
    for (const df of [-1, 1]) {
      const nf = f + df;
      if (onBoard(nf, pr) && board[sqIdx(nf, pr)] === by + 'p') return true;
    }
    for (const d of KNIGHT) {
      const nf = f + d[0], nr = r + d[1];
      if (onBoard(nf, nr) && board[sqIdx(nf, nr)] === by + 'n') return true;
    }
    for (const d of ALL8) {
      const nf = f + d[0], nr = r + d[1];
      if (onBoard(nf, nr) && board[sqIdx(nf, nr)] === by + 'k') return true;
    }
    const rays = [[DIAG, 'b'], [ORTHO, 'r']];
    for (const ray of rays) {
      for (const d of ray[0]) {
        let nf = f + d[0], nr = r + d[1];
        while (onBoard(nf, nr)) {
          const p = board[sqIdx(nf, nr)];
          if (p) {
            if (p[0] === by && (p[1] === ray[1] || p[1] === 'q')) return true;
            break;
          }
          nf += d[0]; nr += d[1];
        }
      }
    }
    return false;
  }

  function inCheck(state, color) {
    const k = kingSquare(state.board, color);
    return k >= 0 && isAttacked(state.board, k, other(color));
  }

  function pushPawnMoves(list, from, to, color, extra) {
    const promoRank = color === WHITE ? 0 : 7;
    if (rankOf(to) === promoRank) {
      for (const p of ['q', 'r', 'b', 'n']) list.push(Object.assign({ from: from, to: to, promo: p }, extra));
    } else {
      list.push(Object.assign({ from: from, to: to, promo: null }, extra));
    }
  }

  /* Pseudo-legale zetten: de eigen koning mag hier nog in schaak komen. */
  function pseudoMoves(state, color) {
    const b = state.board, out = [];
    for (let i = 0; i < 64; i++) {
      const p = b[i];
      if (!p || p[0] !== color) continue;
      const f = fileOf(i), r = rankOf(i), type = p[1];

      if (type === 'p') {
        const dir = color === WHITE ? -1 : 1;
        const start = color === WHITE ? 6 : 1;
        if (onBoard(f, r + dir) && !b[sqIdx(f, r + dir)]) {
          pushPawnMoves(out, i, sqIdx(f, r + dir), color, {});
          const two = sqIdx(f, r + 2 * dir);
          if (r === start && !b[two]) out.push({ from: i, to: two, promo: null, double: true });
        }
        for (const df of [-1, 1]) {
          const nf = f + df, nr = r + dir;
          if (!onBoard(nf, nr)) continue;
          const t = sqIdx(nf, nr);
          if (b[t] && b[t][0] !== color) pushPawnMoves(out, i, t, color, {});
          else if (state.ep === t) out.push({ from: i, to: t, promo: null, ep: true });
        }
      } else if (type === 'n' || type === 'k') {
        const dirs = type === 'n' ? KNIGHT : ALL8;
        for (const d of dirs) {
          const nf = f + d[0], nr = r + d[1];
          if (!onBoard(nf, nr)) continue;
          const t = sqIdx(nf, nr);
          if (!b[t] || b[t][0] !== color) out.push({ from: i, to: t, promo: null });
        }
      } else {
        const dirs = type === 'b' ? DIAG : type === 'r' ? ORTHO : ALL8;
        for (const d of dirs) {
          let nf = f + d[0], nr = r + d[1];
          while (onBoard(nf, nr)) {
            const t = sqIdx(nf, nr);
            if (!b[t]) out.push({ from: i, to: t, promo: null });
            else {
              if (b[t][0] !== color) out.push({ from: i, to: t, promo: null });
              break;
            }
            nf += d[0]; nr += d[1];
          }
        }
      }
    }

    // rokade
    const hr = color === WHITE ? 7 : 0;
    const kIdx = sqIdx(4, hr);
    if (b[kIdx] === color + 'k' && !isAttacked(b, kIdx, other(color))) {
      const rightsK = color === WHITE ? state.castling.wK : state.castling.bK;
      const rightsQ = color === WHITE ? state.castling.wQ : state.castling.bQ;
      if (rightsK && b[sqIdx(7, hr)] === color + 'r' &&
        !b[sqIdx(5, hr)] && !b[sqIdx(6, hr)] &&
        !isAttacked(b, sqIdx(5, hr), other(color)) &&
        !isAttacked(b, sqIdx(6, hr), other(color))) {
        out.push({ from: kIdx, to: sqIdx(6, hr), promo: null, castle: 'K' });
      }
      if (rightsQ && b[sqIdx(0, hr)] === color + 'r' &&
        !b[sqIdx(1, hr)] && !b[sqIdx(2, hr)] && !b[sqIdx(3, hr)] &&
        !isAttacked(b, sqIdx(3, hr), other(color)) &&
        !isAttacked(b, sqIdx(2, hr), other(color))) {
        out.push({ from: kIdx, to: sqIdx(2, hr), promo: null, castle: 'Q' });
      }
    }
    return out;
  }

  function makeMove(state, m) {
    const s = cloneState(state);
    const b = s.board;
    const piece = b[m.from];
    const color = piece[0];
    const captured = m.ep ? b[m.to + (color === WHITE ? 8 : -8)] : b[m.to];

    b[m.to] = m.promo ? color + m.promo : piece;
    b[m.from] = null;
    if (m.ep) b[m.to + (color === WHITE ? 8 : -8)] = null;

    if (m.castle) {
      const hr = color === WHITE ? 7 : 0;
      if (m.castle === 'K') { b[sqIdx(5, hr)] = b[sqIdx(7, hr)]; b[sqIdx(7, hr)] = null; }
      else { b[sqIdx(3, hr)] = b[sqIdx(0, hr)]; b[sqIdx(0, hr)] = null; }
    }

    if (piece[1] === 'k') {
      if (color === WHITE) { s.castling.wK = false; s.castling.wQ = false; }
      else { s.castling.bK = false; s.castling.bQ = false; }
    }
    const corners = { 63: 'wK', 56: 'wQ', 7: 'bK', 0: 'bQ' };
    if (corners[m.from]) s.castling[corners[m.from]] = false;
    if (corners[m.to]) s.castling[corners[m.to]] = false;

    s.ep = m.double ? (m.from + m.to) / 2 : null;
    s.half = (piece[1] === 'p' || captured) ? 0 : s.half + 1;
    if (color === BLACK) s.full++;
    s.turn = other(color);
    s.captured = captured || null;
    return s;
  }

  function legalMoves(state) {
    const color = state.turn;
    return pseudoMoves(state, color).filter(m => !inCheck(makeMove(state, m), color));
  }

  function insufficientMaterial(board) {
    const minors = [];
    for (const p of board) {
      if (!p) continue;
      const t = p[1];
      if (t === 'p' || t === 'r' || t === 'q') return false;
      if (t !== 'k') minors.push(p);
    }
    return minors.length <= 1;
  }

  function gameStatus(state, moves) {
    const list = moves || legalMoves(state);
    const check = inCheck(state, state.turn);
    if (list.length === 0) return check ? 'checkmate' : 'stalemate';
    if (state.half >= 100) return 'fifty';
    if (insufficientMaterial(state.board)) return 'material';
    return check ? 'check' : 'ok';
  }

  /* Standaard algebraïsche notatie. */
  function toSAN(state, move, legal) {
    const b = state.board, piece = b[move.from], type = piece[1];
    let san;
    if (move.castle) {
      san = move.castle === 'K' ? 'O-O' : 'O-O-O';
    } else if (type === 'p') {
      san = '';
      if (b[move.to] || move.ep) san += FILES[fileOf(move.from)] + 'x';
      san += name(move.to);
      if (move.promo) san += '=' + move.promo.toUpperCase();
    } else {
      san = type.toUpperCase();
      const others = (legal || legalMoves(state)).filter(o =>
        o.to === move.to && o.from !== move.from && b[o.from] === piece);
      if (others.length) {
        const sameFile = others.some(o => fileOf(o.from) === fileOf(move.from));
        const sameRank = others.some(o => rankOf(o.from) === rankOf(move.from));
        if (!sameFile) san += FILES[fileOf(move.from)];
        else if (!sameRank) san += (8 - rankOf(move.from));
        else san += name(move.from);
      }
      if (b[move.to]) san += 'x';
      san += name(move.to);
    }
    const st = gameStatus(makeMove(state, move));
    if (st === 'checkmate') san += '#';
    else if (st === 'check') san += '+';
    return san;
  }

  /* ------------------------------ computer ------------------------------ */
  const VALUE = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
  const PST = {
    p: [0, 0, 0, 0, 0, 0, 0, 0,
      50, 50, 50, 50, 50, 50, 50, 50,
      10, 10, 20, 30, 30, 20, 10, 10,
      5, 5, 10, 25, 25, 10, 5, 5,
      0, 0, 0, 20, 20, 0, 0, 0,
      5, -5, -10, 0, 0, -10, -5, 5,
      5, 10, 10, -20, -20, 10, 10, 5,
      0, 0, 0, 0, 0, 0, 0, 0],
    n: [-50, -40, -30, -30, -30, -30, -40, -50,
      -40, -20, 0, 0, 0, 0, -20, -40,
      -30, 0, 10, 15, 15, 10, 0, -30,

if (typeof document !== 'undefined') (function () {

  const rowSide = document.getElementById('rowSide');
  const rowLevel = document.getElementById('rowLevel');
  const btnUndo = document.getElementById('btnUndo');
  const btnHint = document.getElementById('btnHint');
  const strengthEl = document.getElementById('strength');
  const evalFill = document.getElementById('evalFill');
  const evalScoreEl = document.getElementById('evalScore');
  const evalNote = document.getElementById('evalNote');

  const PIECE_VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

  /* Materiaalverschil in punten, positief = voordeel voor wit. */
  function materialDiff() {
    let d = 0;
    for (const p of state.board) if (p) d += (p[0] === 'w' ? 1 : -1) * PIECE_VAL[p[1]];
    return d;
  }

  function renderEval() {
    const st = E.gameStatus(state, legal);
    let score, text, note;

    if (st === 'checkmate') {
      const winner = state.turn === 'w' ? 'b' : 'w';
      score = winner === 'w' ? 9999 : -9999;
      text = winner === 'w' ? '1-0' : '0-1';
      note = 'Schaakmat \u2014 ' + NAME[winner] + ' wint.';
    } else if (st === 'stalemate' || st === 'fifty' || st === 'material') {
      score = 0; text = '\u00bd-\u00bd'; note = 'Remise.';
    } else {
      score = E.evalScore(state, 2);
      const pawns = score / 100;
      text = (pawns > 0 ? '+' : '') + pawns.toFixed(1);
      const a = Math.abs(score);
      const leader = score > 0 ? 'Wit' : 'Paars';
      if (a < 30) note = 'De stelling is in evenwicht.';
      else if (a < 90) note = leader + ' staat iets beter.';
      else if (a < 250) note = leader + ' staat beter.';
      else if (a < 600) note = leader + ' staat duidelijk beter.';
      else note = leader + ' staat gewonnen.';
      const md = materialDiff();

      if (hint && i === hint.to) sq.classList.add('hintto');
      if (i === checkedKing) sq.classList.add('check');

        el.className = 'piece ' + p[0];
